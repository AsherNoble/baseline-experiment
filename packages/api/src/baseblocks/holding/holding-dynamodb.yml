Resources:
  holdingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: ${self:custom.deletionPolicy.${opt:stage}}
    UpdateReplacePolicy: ${self:custom.updatePolicy.${opt:stage}}
    Properties:
      TableName: ${env:APP_NAME}-${opt:stage}-holding
      AttributeDefinitions:
        - AttributeName: holdingId
          AttributeType: S
        - AttributeName: portfolioId
          AttributeType: S
        - AttributeName: symbol
          AttributeType: S
      KeySchema:
        - AttributeName: holdingId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: portfolioId-index
          KeySchema:
            - AttributeName: portfolioId
              KeyType: HASH
            - AttributeName: symbol
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
